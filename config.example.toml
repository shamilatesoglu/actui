# Copy to ~/.config/actui/config.toml (Windows: %APPDATA%\actui\config.toml)
# All fields are optional; shown values are the defaults.

# broad sweep of ALL watched repos (catches new/finished runs)
refresh_secs        = 60
# focused poll of just the SELECTED run's jobs, while it's still running
active_refresh_secs = 15
runs_per_repo       = 15  # recent runs pulled per repo
concurrency         = 3   # repos fetched in parallel (kept low to avoid bursts)
max_repos           = 60  # cap, from most-recently-pushed repos (0 = no cap)
skip_archived       = true # ignore archived repos

# Repos sidebar: on by default, `p` toggles it, and a narrow terminal drops it.
# Drag its border (or press `<` / `>`) to resize; drag a column header's edge to
# size that column. Widths live in state.toml; `=` puts them back.
sidebar = true
# Repos kept at the top of it, in this order.
pinned  = []            # e.g. ["nodos-dev/api", "shamilatesoglu/actui"]
# Order for everything below the pinned repos: "alpha" (A→Z) or "used" (the
# repos you work in most, decayed week by week).
sort    = "alpha"

# Only watch repos whose full_name contains one of these substrings.
# Empty = every repo you own or are an org member of.
include = []            # e.g. ["nodos-dev/", "shamilatesoglu/actui"]

# Always drop repos whose full_name contains one of these substrings.
exclude = []
