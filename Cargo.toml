[package]
name = "actui"
version = "0.1.0"
edition = "2021"
description = "A beautiful TUI to view and manage GitHub Actions across your repos and orgs"
license = "MIT"
repository = "https://github.com/shamilatesoglu/actui"
readme = "README.md"
keywords = ["github", "actions", "tui", "ci", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "actui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
ansi-to-tui = "7"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
futures = "0.3"
open = "5"
dirs = "5"
toml = "0.8"
serde_yaml = "0.9"
base64 = "0.22"
notify-rust = "4"
dark-light = "1"

[profile.release]
lto = "thin"
strip = true
